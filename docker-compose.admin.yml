# =============================================================================
#  docker-compose.admin.yml — ОПЦИОНАЛЬНОЕ расширение для администрирования.
#  Подключается только явно:
#    docker compose -f docker-compose.yml -f docker-compose.admin.yml up -d
#
#  ВНИМАНИЕ: публикует админ-интерфейсы Nginx Proxy Manager и SeaweedFS
#  на всех интерфейсах. Допустимо только в доверенной сети или за VPN:
#    1) ограничьте доступ через ufw (только офисная/VPN-подсеть);
#    2) включите 2FA в NPM;
#    3) после работ вернитесь к обычному стеку (make down && make up).
# =============================================================================
services:
  proxy:
    ports:
      - "${NPM_ADMIN_BIND_LAN:-0.0.0.0}:${NPM_ADMIN_PORT:-8181}:81"

  s3:
    ports:
      - "${SEAWEEDFS_ADMIN_BIND_LAN:-0.0.0.0}:9333:9333"
      - "${SEAWEEDFS_ADMIN_BIND_LAN:-0.0.0.0}:${SEAWEEDFS_FILER_PORT:-8888}:8888"
