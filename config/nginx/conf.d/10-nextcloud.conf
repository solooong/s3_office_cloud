# =============================================================================
#  Nextcloud 35 — virtual host (HTTP front controller for PHP-FPM at app:9000)
#  ---------------------------------------------------------------------------
#  Traffic path:  client -> NPM :443 (TLS, HSTS) -> http://web:8080 -> PHP-FPM
#  The web tier is Host-agnostic: the public host names are rendered from the
#  environment at container start
#      templates/cloudsuite/server-names.conf.template
#  ->  /var/run/cloudsuite/server-names.conf
#  ->  include below (wildcard, so a bare checkout still passes `nginx -t`).
# =============================================================================

server {
    listen      8080;
    server_name web;                       # static fallback = docker DNS name

    # Rendered at start-up: server_name $CLOUD_DOMAIN $OFFICE_DOMAIN;
    # (multiple server_name directives are merged; `web` above stays valid)
    include /var/run/cloudsuite/server-name*.conf;

    # Rendered at start-up: client_max_body_size $PHP_UPLOAD_LIMIT;
    # (server level — the static default in nginx.conf/snippets/upload-limit.conf
    #  applies only when the template was not rendered, e.g. CI `nginx -t`.)
    include /var/run/cloudsuite/upload-limit*.conf;

    # --- Document root (read-only bind mount of the nextcloud_html volume) ---
    root  /var/www/html;
    index index.php index.html /index.php$request_uri;
    charset utf-8;

    access_log /var/log/nginx/access.json.log json_combined;
    error_log  /var/log/nginx/error.log warn;
    log_not_found off;

    # TLS terminates at NPM on :443 while this server listens on :8080.
    # Absolute redirects would therefore advertise "http://host:8080/..."
    # to the browser; emit relative Location headers instead.
    absolute_redirect off;
    port_in_redirect  off;

    # --- Trusted proxy: real client IP for logs / Nextcloud throttling ------
    include /etc/nginx/snippets/realip.conf;

    # --- Hardened response headers (HSTS is NPM's job) ----------------------
    include /etc/nginx/snippets/security-headers.conf;

    # --- Never serve internals, backups, dotfiles ---------------------------
    #     (included first: these regex locations must win over static-cache)
    include /etc/nginx/snippets/block-sensitive.conf;

    # --- Discovery endpoints (same rules as Nextcloud's .htaccess) ----------
    location ^~ /.well-known {
        location = /.well-known/carddav { return 301 /remote.php/dav/; }
        location = /.well-known/caldav  { return 301 /remote.php/dav/; }

        # ACME HTTP-01 is answered by NPM; Nextcloud never sees these.
        location ^~ /.well-known/acme-challenge { return 404; }

        # webfinger / nodeinfo / everything else -> front controller
        return 301 /index.php$uri;
    }

    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }

    # Legacy entry point used by some clients / old bookmarks.
    location = /index.html {
        return 302 /index.php$request_uri;
    }

    # --- PHP-FPM (app:9000) -------------------------------------------------
    #     Must stay ABOVE snippets/static-cache.conf: WebDAV URLs such as
    #     /remote.php/dav/files/alice/report.pdf end with a static extension
    #     but are handled by PHP.
    location ~ \.php(?:$|/) {
        # Only these entry points may be executed directly; everything else is
        # funnelled through /index.php (Nextcloud pretty URLs / front controller).
        rewrite ^/(?!index|remote|public|cron|core\/ajax\/update|status|ocs\/v[12]|updater\/.+|ocs-provider\/.+|.+\/richdocumentscode(_arm64)?\/proxy) /index.php$request_uri;

        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        set $path_info $fastcgi_path_info;

        try_files $fastcgi_script_name =404;

        include /etc/nginx/snippets/fastcgi-nextcloud.conf;

        # Resolved through Docker DNS (resolver in nginx.conf), so the config is
        # valid even when the PHP container does not exist yet (`nginx -t`).
        set $php_fpm app:9000;
        fastcgi_pass $php_fpm;
    }

    # --- Immutable caching for /core /apps /dist /build + static extensions -
    include /etc/nginx/snippets/static-cache.conf;

    # --- Everything else -> Nextcloud front controller -----------------------
    location / {
        try_files $uri $uri/ /index.php$request_uri;
    }

    # The web updater is not used: Nextcloud is updated by pulling a new image.
    location ^~ /updater/ {
        return 404;
    }

    # Deny by default: unknown methods are rejected (Nextcloud uses GET/POST/
    # PUT/DELETE/PATCH/PROPFIND/PROPPATCH/MKCOL/COPY/MOVE/REPORT/HEAD/OPTIONS).
    if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|PATCH|OPTIONS|PROPFIND|PROPPATCH|MKCOL|COPY|MOVE|LOCK|UNLOCK|REPORT|SEARCH)$) {
        return 405;
    }
}
