# =============================================================================
#  Guard server (`default_server`) — :8080
#  ---------------------------------------------------------------------------
#  Every request that reaches the web tier with a Host header that does not
#  match the Nextcloud virtual host lands here and is closed with 444
#  ("no response"): no banner, no error page, no information leak.
#
#  It also owns the two operational endpoints, which must be reachable
#  regardless of the Host header (the compose healthcheck talks to
#  127.0.0.1:8080 and therefore never matches a public server name):
#      GET /healthz  -> 200 "ok"          liveness probe
#      GET /status   -> nginx stub_status metrics, loopback only
#
#  Contract: docker-compose healthcheck uses http://127.0.0.1:8080/status
# =============================================================================

server {
    listen      8080 default_server;
    server_name _;

    server_tokens off;

    access_log /var/log/nginx/access.json.log json_combined;
    error_log  /var/log/nginx/error.log warn;

    # Silence "client sent invalid host" noise from scanners, keep the audit log.
    log_not_found off;

    # Liveness — plain text, no cache, no logging.
    location = /healthz {
        access_log off;
        add_header Cache-Control "no-store" always;
        default_type text/plain;
        return 200 "ok\n";
    }

    # nginx stub_status — internal monitoring only.
    # Reachable from inside the container (127.0.0.1) and from nowhere else.
    location = /status {
        allow 127.0.0.1;
        allow ::1;
        deny  all;

        access_log off;
        stub_status;
    }

    # Everything else: unknown / spoofed Host header.
    location / {
        return 444;
    }
}
