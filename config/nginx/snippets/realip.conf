# =============================================================================
#  Real client IP behind Nginx Proxy Manager
#  ---------------------------------------------------------------------------
#  The ONLY trusted reverse proxy is NPM on the edge network (172.28.10.0/24).
#  NPM appends the real client address to X-Forwarded-For and `real_ip_recursive`
#  walks the chain from the right, so a client-supplied (forged) X-Forwarded-For
#  is never trusted. $remote_addr (and therefore REMOTE_ADDR in PHP and the audit
#  log) becomes the public client address.
#
#  Keep this list in sync with TRUSTED_PROXIES in .env (contract: 172.28.10.0/24).
# =============================================================================

set_real_ip_from   172.28.10.0/24;
real_ip_header     X-Forwarded-For;
real_ip_recursive  on;
