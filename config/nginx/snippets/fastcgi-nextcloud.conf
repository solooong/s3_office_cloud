# =============================================================================
#  FastCGI wiring for Nextcloud (PHP-FPM at app:9000)
#  ---------------------------------------------------------------------------
#  Included inside:  location ~ \.php(?:$|/) { ... include ...; fastcgi_pass app:9000; }
#  Expects `$path_info` to be set by the caller (fastcgi_split_path_info).
# =============================================================================

include /etc/nginx/fastcgi_params;

# --- Script resolution ------------------------------------------------------
fastcgi_param SCRIPT_FILENAME  $document_root$fastcgi_script_name;
fastcgi_param PATH_INFO        $path_info;

# --- Proxy / TLS context ----------------------------------------------------
# TLS terminates at NPM; expose the original scheme to PHP.
fastcgi_param HTTPS            $fastcgi_https;
fastcgi_param REQUEST_SCHEME   $client_scheme;

# Never let PHP inherit an HTTP(S)_PROXY from the environment.
fastcgi_param HTTP_PROXY       "";

# X-Forwarded-* -> $_SERVER['HTTP_X_FORWARDED_*'] (Nextcloud URL detection and
# trusted-proxy handling). nginx also forwards the raw client headers as HTTP_*
# params (fastcgi_pass_request_headers is on by default); these explicit lines
# document the contract and keep the values identical to the received headers.
fastcgi_param HTTP_X_FORWARDED_PROTO  $http_x_forwarded_proto;
fastcgi_param HTTP_X_FORWARDED_HOST   $http_x_forwarded_host;
fastcgi_param HTTP_X_FORWARDED_FOR    $http_x_forwarded_for;

# Real client address (after the realip module rewrote $remote_addr).
fastcgi_param REMOTE_ADDR      $remote_addr;

# The block has several names (public domain + docker name); expose the Host the
# client actually used instead of nginx's first server_name token.
fastcgi_param SERVER_NAME      $host;

# --- Nextcloud specifics ----------------------------------------------------
fastcgi_param modHeadersAvailable   true;   # security headers already sent by nginx
fastcgi_param front_controller_active true; # pretty URLs without index.php

fastcgi_hide_header X-Powered-By;

# --- Timeouts / buffering ---------------------------------------------------
# 10 GiB uploads, slow clients and WebDAV chunk assembly need generous timeouts.
fastcgi_connect_timeout     60s;
fastcgi_send_timeout        3600s;
fastcgi_read_timeout        3600s;

# Official Nextcloud tuning: many small buffers, no temp files on disk.
fastcgi_buffers             64 4k;
fastcgi_buffer_size         32k;
fastcgi_busy_buffers_size   128k;
fastcgi_max_temp_file_size  0;

fastcgi_request_buffering   off;    # stream the body straight to PHP-FPM
fastcgi_intercept_errors    on;     # let Nextcloud render its own error pages
