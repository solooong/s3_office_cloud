# =============================================================================
#  Upload size limit — static default
#  ---------------------------------------------------------------------------
#  `client_max_body_size` must equal PHP_UPLOAD_LIMIT from .env (10G by
#  default) and the PHP limits in config/nextcloud/php.ini.
#
#  This file is the fallback so the configuration is always valid and usable
#  (CI `nginx -t`, bare checkout). At container start the official entrypoint
#  renders PHP_UPLOAD_LIMIT into /tmp/cloudsuite/http-upload-limit.conf, which
#  nginx.conf includes AFTER this file — a later http-level directive wins, so
#  the environment value is authoritative whenever templates are rendered.
# =============================================================================

client_max_body_size 10G;
