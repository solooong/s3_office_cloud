# =============================================================================
#  Static assets — immutable, long-lived browser caching
#  ---------------------------------------------------------------------------
#  Included at server level AFTER the PHP location (WebDAV URLs must reach PHP)
#  and AFTER snippets/block-sensitive.conf (deny rules win over caching).
#
#  Nextcloud fingerprints these files, so they can be cached "forever".
#  Any add_header in a location resets the inherited header set, therefore
#  snippets/security-headers.conf is re-included in each block below.
# =============================================================================

# /core /apps /dist /build — compiled front-end assets of Nextcloud and apps.
# NB: `expires` is intentionally not used — it would emit a second
# Cache-Control header next to the explicit one below.
location ~ ^/(?:core|apps|dist|build)(?:/|$) {
    try_files $uri /index.php$request_uri;

    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/security-headers.conf;
}

# Bare static extensions (icons, web fonts, images, source maps, wasm).
location ~* \.(?:css|js|mjs|map|json|svg|gif|ico|jpe?g|png|webp|avif|woff2?|ttf|eot|otf|wasm)$ {
    try_files $uri /index.php$request_uri;

    access_log off;
    add_header Cache-Control "public, max-age=15778463, immutable" always;
    include /etc/nginx/snippets/security-headers.conf;
}
