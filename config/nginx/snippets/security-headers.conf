# =============================================================================
#  Hardened response headers for the Nextcloud web tier
#  ---------------------------------------------------------------------------
#  Deliberately NOT set here:
#    * Strict-Transport-Security — NPM owns HSTS (Force SSL + HSTS toggles in the
#      SSL tab, see config/proxy/npm-gui-setup.md). Duplicating it here would
#      emit two STS headers for the same response.
#    * Content-Security-Policy, Cross-Origin-Opener/Embedder-Policy and
#      Cross-Origin-Resource-Policy — ONLYOFFICE Docs 8.3.3 renders the editor in
#      a cross-origin iframe (https://$OFFICE_DOMAIN) and streams documents to
#      and from it. Hard isolation headers break the editor, the WOPI/file
#      download flow and the "Open in ONLYOFFICE" hand-shake. Nextcloud itself
#      ships a per-request, nonce-based CSP; do not override it here.
#
#  Because any `add_header` in a nested location drops the inherited set, this
#  file is re-included in every location that adds its own headers
#  (see snippets/static-cache.conf).
# =============================================================================

add_header Referrer-Policy                    "no-referrer"           always;
add_header X-Content-Type-Options             "nosniff"               always;
add_header X-Download-Options                 "noopen"                always;
add_header X-Frame-Options                    "SAMEORIGIN"            always;
add_header X-Permitted-Cross-Domain-Policies  "none"                  always;
add_header X-Robots-Tag                       "noindex, nofollow"     always;
add_header X-XSS-Protection                   "1; mode=block"         always;
