# =============================================================================
#  Sensitive paths — the web tier must never return these to a client
#  ---------------------------------------------------------------------------
#  Included at server level BEFORE any other regex location and before
#  snippets/static-cache.conf, because nginx resolves regex locations in the
#  order they are defined.
# =============================================================================

# Nextcloud application code, configuration, data and DB storage.
#   /data        - user files + appdata (also mounted read-only into this container)
#   /config      - config.php (DB/Redis/S3 credentials)
#   /lib,/3rdparty,/templates,/tests - server-side PHP code
#   /db_storage  - external storage marker directory (must never be listed)
location ~ ^/(?:data|config|lib|3rdparty|templates|tests|db_storage)(?:$|/) {
    return 404;
}

# CLI / maintenance entry points that have no business on the public edge.
location ~ ^/(?:occ|console|autotest|indie|db_)(?:$|/) {
    return 404;
}

# Dotfiles and dot-directories: /.htaccess, /.htpasswd, /.ocdata, /.user.ini,
# /.env, /.git, /.maintenance ... — with the exception of /.well-known/.
location ~ /\.(?!well-known/) {
    return 404;
}
