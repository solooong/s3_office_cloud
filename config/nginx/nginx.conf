# =============================================================================
#  Cloud Suite — edge nginx (`web` tier)
#  ---------------------------------------------------------------------------
#  Role : HTTP front controller for Nextcloud 35 (PHP-FPM at app:9000).
#         The container listens on :8080 inside the docker `edge` network
#         (172.28.10.0/24) and is NEVER published to the host. All client
#         traffic enters through Nginx Proxy Manager (`proxy`, 172.28.10.10),
#         which terminates TLS, sets HSTS and applies access lists.
#
#  Image : nginx:1.29-alpine (pinned by NGINX_VERSION in .env)
#
#  Mounts (see docker-compose.yml; all read-only except the log directory):
#      config/nginx/nginx.conf  -> /etc/nginx/nginx.conf      ro
#      config/nginx/conf.d      -> /etc/nginx/conf.d          ro
#      config/nginx/snippets    -> /etc/nginx/snippets        ro
#      config/nginx/templates   -> /etc/nginx/templates       ro
#      logs/nginx               -> /var/log/nginx             rw
#
#  Generated at container start (official entrypoint script
#  /docker-entrypoint.d/20-envsubst-on-templates.sh) into
#  $NGINX_ENVSUBST_OUTPUT_DIR (compose: /var/run, a writable tmpfs):
#      templates/cloudsuite/upload-limit.conf.template
#          -> /var/run/cloudsuite/upload-limit.conf   (client_max_body_size, server level)
#      templates/cloudsuite/server-names.conf.template
#          -> /var/run/cloudsuite/server-names.conf   (server_name allow-list)
#
#  This file is deliberately Host-agnostic: no customer domain is baked in.
#  Public names arrive only through the environment (CLOUD_DOMAIN,
#  OFFICE_DOMAIN), so the same config works for any organisation.
# =============================================================================

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

pid /var/run/nginx.pid;

# Diagnostics only; per-request audit data lives in the JSON access log below.
error_log /var/log/nginx/error.log warn;

events {
    worker_connections  8192;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # -------------------------------------------------------------------------
    #  Logging — one JSON object per request (audit / SIEM friendly).
    #  Consumed by docs/05-audit-logging.md; keep field names stable.
    # -------------------------------------------------------------------------
    log_format json_combined escape=json
    '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"x_forwarded_for":"$http_x_forwarded_for",'
        '"realip_remote_addr":"$realip_remote_addr",'
        '"host":"$host",'
        '"server_port":$server_port,'
        '"scheme":"$scheme",'
        '"request_method":"$request_method",'
        '"uri":"$uri",'
        '"request_uri":"$request_uri",'
        '"protocol":"$server_protocol",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_length":$request_length,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"request_id":"$request_id"'
    '}';

    access_log /var/log/nginx/access.json.log json_combined buffer=64k flush=1s;

    # -------------------------------------------------------------------------
    #  Scheme / TLS awareness. TLS is terminated by NPM, which always sends
    #  X-Forwarded-Proto; fall back to the local scheme for direct requests
    #  from the edge network.
    # -------------------------------------------------------------------------
    map $http_x_forwarded_proto $client_scheme {
        default $scheme;
        http    http;
        https   https;
    }

    # HTTPS=on for PHP when the end user connected over TLS.
    map $http_x_forwarded_proto $fastcgi_https {
        default off;
        https   on;
    }

    # -------------------------------------------------------------------------
    #  Transport tuning
    # -------------------------------------------------------------------------
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    server_tokens       off;
    keepalive_timeout   75s;
    keepalive_requests  1000;

    client_header_timeout  120s;
    client_body_timeout    3600s;
    send_timeout           3600s;
    reset_timedout_connection on;
    lingering_close        on;
    lingering_time         30s;
    lingering_timeout      10s;

    client_body_buffer_size     512k;
    client_header_buffer_size   4k;
    large_client_header_buffers 4 16k;

    types_hash_max_size          4096;
    server_names_hash_bucket_size 128;

    # Static files are immutable for a long time (see snippets/static-cache.conf).
    open_file_cache          max=10000 inactive=60s;
    open_file_cache_valid    120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   off;

    # -------------------------------------------------------------------------
    #  Compression — text assets only; already-compressed media is never
    #  recompressed, and ONLYOFFICE payloads are not served by this tier.
    # -------------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_disable      "msie6";
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/rss+xml
        application/atom+xml
        application/wasm
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # -------------------------------------------------------------------------
    #  Upload limit: static default (10G = PHP_UPLOAD_LIMIT default).
    #  The environment value overrides it INSIDE the Nextcloud server block
    #  (nginx rejects a duplicate directive in the same context, therefore the
    #  rendered override is a server-level directive, not an http-level one).
    # -------------------------------------------------------------------------
    include /etc/nginx/snippets/upload-limit.conf;

    # -------------------------------------------------------------------------
    #  Upstream name resolution — Docker's embedded DNS.
    #  `app:9000` is resolved at request time (see conf.d/10-nextcloud.conf),
    #  so `nginx -t` never needs the PHP container to exist and a recreated
    #  `app` container is picked up without reloading nginx.
    # -------------------------------------------------------------------------
    resolver         127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # -------------------------------------------------------------------------
    #  Virtual hosts
    # -------------------------------------------------------------------------
    include /etc/nginx/conf.d/*.conf;
}
