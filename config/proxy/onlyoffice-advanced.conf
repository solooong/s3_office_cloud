# =============================================================================
#  Nginx Proxy Manager — "Advanced" tab for the ONLYOFFICE Docs proxy host
#  ---------------------------------------------------------------------------
#  Placement:  NPM GUI -> Hosts -> Proxy Hosts -> <office host> -> Advanced
#              -> "Custom Nginx Configuration" -> paste the ACTIVE part below
#  Upstream :  forward hostname/ip = onlyoffice   forward port = 80   scheme http
#
#  What NPM 2.16.0 already does for this host (do NOT repeat it here):
#    * http level : client_max_body_size 2000m, proxy_*_timeout 90s,
#                   proxy_http_version 1.1, server_tokens off, gzip on
#    * location / : Host / X-Forwarded-Scheme / X-Forwarded-Proto /
#                   X-Forwarded-For / X-Real-IP proxy headers
#    * SSL tab    : Force SSL, HSTS, HTTP/2
#  => HSTS comes from the SSL tab; do not add Strict-Transport-Security here.
#
#  REQUIRED in the Details tab: "Websockets Support" = ON.
#  Co-editing keeps a websocket (socket.io, path /doc/) open for the whole
#  editing session; without the upgrade the editor falls back to long polling
#  and sessions become slow/unstable.
#
#  IMPORTANT nginx rule: proxy_set_header written at server level (here) is
#  discarded inside NPM's "location /" — the headers listed above are already
#  emitted there. Use the COPY-PASTE BLOCK at the bottom only for custom
#  locations.
# =============================================================================

# --- Request body -----------------------------------------------------------
# The browser never uploads documents to the editor: files are streamed from
# Nextcloud by the DS server. Only editor payloads, callbacks and small
# conversion requests arrive here, so 100m is generous.
client_max_body_size 100m;

# --- Long-lived editing sessions -------------------------------------------
# A document may stay open for hours; conversion/save callbacks to Nextcloud can
# be slow on large files. Keep the connection open for up to one hour.
client_body_timeout   3600s;
send_timeout          3600s;
proxy_connect_timeout 60s;
proxy_send_timeout    3600s;
proxy_read_timeout    3600s;

# --- Big buffers ------------------------------------------------------------
# The editor downloads its own static bundles and document caches; generous
# buffers avoid extra round trips, and proxy_max_temp_file_size 0 prevents
# multi-hundred-megabyte response bodies from being spooled to NPM's disk
# (nginx streams them as soon as the buffers are full).
proxy_buffer_size        64k;
proxy_buffers            16 64k;
proxy_busy_buffers_size  128k;
proxy_max_temp_file_size 0;
proxy_buffering          on;

# Server-side downloads of the edited document (Nextcloud -> DS) are streamed.
proxy_request_buffering  off;

# --- HTTP version -----------------------------------------------------------
# Required for keepalive/websocket upgrades towards onlyoffice:80.
proxy_http_version 1.1;

# --- Big headers ------------------------------------------------------------
# The editor sends long query strings and a JWT ("Authorization: Bearer ...")
# for every request.
large_client_header_buffers 4 32k;

# =============================================================================
#  COPY-PASTE BLOCK — only needed if you replace "location /" with a
#  CUSTOM LOCATION. OnlyOffice expects these headers from the reverse proxy:
#
#  proxy_http_version 1.1;
#  proxy_set_header Host              $host;
#  proxy_set_header X-Forwarded-Host  $host;
#  proxy_set_header X-Forwarded-Proto $scheme;
#  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#  proxy_set_header X-Real-IP         $remote_addr;
#  proxy_set_header Upgrade           $http_upgrade;
#  proxy_set_header Connection        $http_connection;
# =============================================================================
