# =============================================================================
#  Nginx Proxy Manager — "Advanced" tab for the Nextcloud proxy host
#  ---------------------------------------------------------------------------
#  Placement:  NPM GUI -> Hosts -> Proxy Hosts -> <cloud host> -> Advanced
#              -> "Custom Nginx Configuration" -> paste the ACTIVE part below
#              -> Save
#  Upstream :  forward hostname/ip = web   forward port = 8080   scheme http
#
#  This text is inserted into the generated server block of
#  /data/nginx/proxy_host/<id>.conf, i.e. it is server-level configuration.
#
#  What NPM 2.16.0 already does for this host (do NOT repeat it here):
#    * http level : client_max_body_size 2000m, proxy_connect/send/read_timeout
#                   90s, proxy_http_version 1.1, server_tokens off, gzip on
#    * location / : proxy_set_header Host $host;
#                   proxy_set_header X-Forwarded-Scheme $scheme;
#                   proxy_set_header X-Forwarded-Proto  $scheme;
#                   proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
#                   proxy_set_header X-Real-IP          $remote_addr;
#    * SSL tab    : Force SSL (301 http->https), HSTS (max-age 63072000,
#                   optional includeSubDomains + preload), HTTP/2
#  => HSTS is owned by the SSL tab. Never add Strict-Transport-Security here:
#     the response would carry two STS headers.
#
#  IMPORTANT nginx rule: a proxy_set_header written HERE (server level) is
#  DISCARDED inside NPM's "location /", because that location includes its own
#  proxy_set_header directives. Therefore nothing in the active part below uses
#  proxy_set_header — websocket upgrades are enabled with the Details toggle
#  "Websockets Support" (it emits the Upgrade/Connection headers in both places).
# =============================================================================

# --- Upload limit -----------------------------------------------------------
# MUST equal PHP_UPLOAD_LIMIT from .env (10G by default) and the PHP limits in
# config/nextcloud/php.ini. NPM's own default is 2000m — too small for a file
# server, and it would reject the body before it ever reaches Nextcloud.
client_max_body_size 10G;

# --- Long-running requests --------------------------------------------------
# 10 GiB uploads/downloads over slow links, WebDAV chunk assembly, big office
# documents being saved back through the WOPI callback.
client_header_timeout  120s;
client_body_timeout    3600s;
send_timeout           3600s;
proxy_connect_timeout  60s;
proxy_send_timeout     3600s;
proxy_read_timeout     3600s;

# --- Streaming, not spooling ------------------------------------------------
# NPM must not buffer multi-gigabyte bodies on its own filesystem:
#  * proxy_request_buffering off -> the upload is streamed to web:8080 as it
#    arrives (also required for correct WebDAV/PUT behaviour);
#  * proxy_buffering off + proxy_max_temp_file_size 0 -> downloads are streamed
#    to the browser instead of being written to /var/cache/nginx of NPM.
proxy_request_buffering  off;
proxy_buffering          off;
proxy_max_temp_file_size 0;

# --- Big request headers ----------------------------------------------------
# Long WebDAV "If:" / "Destination:" headers and many cookies from Nextcloud
# apps can exceed the default 4x8k buffers.
large_client_header_buffers 4 32k;

# =============================================================================
#  COPY-PASTE BLOCK — only needed if you replace "location /" with a
#  CUSTOM LOCATION (Custom Locations tab). A custom location does not inherit
#  NPM's default proxy headers, so add them explicitly inside that location:
#
#  proxy_http_version 1.1;
#  proxy_set_header Host              $host;
#  proxy_set_header X-Forwarded-Scheme $scheme;
#  proxy_set_header X-Forwarded-Proto  $scheme;
#  proxy_set_header X-Forwarded-Host   $host;
#  proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
#  proxy_set_header X-Real-IP          $remote_addr;
#  proxy_set_header Upgrade           $http_upgrade;
#  proxy_set_header Connection        $http_connection;
# =============================================================================
