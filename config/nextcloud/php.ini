; ============================================================================
;  Cloud Suite — дополнительные настройки PHP
;  Монтируется как /usr/local/etc/php/conf.d/zz-cloudsuite.ini (загружается
;  последним, поэтому переопределяет значения образа Nextcloud).
;
;  ВАЖНО: memory_limit, upload_max_filesize и post_max_size задаются НЕ здесь,
;  а переменными окружения PHP_MEMORY_LIMIT / PHP_UPLOAD_LIMIT в docker-compose.yml
;  (образ nextcloud подставляет их в conf.d/nextcloud.ini).
; ============================================================================

; --- Время выполнения: большие файлы и офисные документы -------------------
max_execution_time = 3600
max_input_time = 3600
default_socket_timeout = 300

; --- Вывод и заголовки ------------------------------------------------------
output_buffering = 0
expose_php = Off
zend.exception_ignore_args = On

; --- Файловая система -------------------------------------------------------
realpath_cache_size = 16M
realpath_cache_ttl = 600

; --- Сессии (Nextcloud управляет cookie сам, но TTL должен быть достаточным) -
session.gc_maxlifetime = 86400
session.cookie_httponly = 1
session.cookie_samesite = "Lax"

; --- APCu (локальный кэш; шаред-память выделяется один раз при старте) ------
apc.shm_size = 256M
apc.entries_hint = 100000
apc.ttl = 7200
apc.gc_ttl = 3600
apc.enable_cli = 1

; --- OPcache: базовые параметры задаёт образ (opcache-recommended.ini) ------
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60

; --- Почта: sendmail в контейнере не используется (SMTP через env) ----------
mail.add_x_header = Off
