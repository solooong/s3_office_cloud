# ============================================================================
#  Cloud Suite — конфигурация Redis
#  Монтируется в /usr/local/etc/redis/redis.conf (только чтение).
#  Пароль передаётся через --requirepass из .env (REDIS_PASSWORD).
#  Redis используется Nextcloud как:
#    * memcache.distributed — общий кэш;
#    * memcache.locking     — файловые блокировки (КРИТИЧНО для S3-хранилища).
# ============================================================================

bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 60
daemonize no
loglevel notice
databases 16

# --- Персистентность -------------------------------------------------------
# AOF не нужен: в Redis только кэш и эфемерные блокировки.
# RDB оставляем для быстрого прогрева после рестарта.
save 900 1
save 300 10
dbfilename dump.rdb
dir /data

# --- Память ----------------------------------------------------------------
# ВАЖНО: политика noeviction. Если Redis начнёт вытеснять ключи, Nextcloud
# потеряет файловые блокировки, что на S3-хранилище приводит к повреждению
# файлов. При росте нагрузки увеличьте maxmemory и память сервера.
maxmemory 1gb
maxmemory-policy noeviction

# --- Безопасность ----------------------------------------------------------
# Опасные команды отключены: в штатной эксплуатации они не используются.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
# rename-command CONFIG отключён намеренно: в Redis 8 (RedisJSON/RedisBloom)
# переименование CONFIG приводит к падению при старте (проверено на 8.4.7).
rename-command SHUTDOWN ""

# --- Прочее ----------------------------------------------------------------
appendonly no
latency-monitor-threshold 100
